<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ninjatruck-favicon.svg" />
    <link rel="apple-touch-icon" href="/ninjatruck-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ninja Truck",
        "legalName": "Ninja Truck Logistics",
        "url": "https://ninjatruck.live",
        "logo": "https://ninjatruck.live/ninjatruck-logo.svg"
      }
    </script>
    <title>Ninja Truck — All Over India Logistics</title>
    <meta name="description" content="Ninja Truck — book mini trucks, heavy vehicles, intercity freight, packers &amp; movers and parcel delivery across India. Verified drivers, live GPS tracking, insured goods." />
    <style>
      body {
        font-family: 'Outfit', sans-serif;
      }
    </style>
    <script>
      // Admin panel theme, applied before first paint so a dark-mode reload
      // doesn't flash white. Kept in step with src/modules/admin/theme/adminThemeStore.js.
      (function () {
        try {
          var pref = localStorage.getItem('adminThemePreference') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-admin-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-admin-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
