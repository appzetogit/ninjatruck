# Ninja Truck — ninjatruck.live.
# Installed at /etc/nginx/sites-available/ninjatruck.live.conf, symlinked into
# sites-enabled. Static frontend from /var/www/ninjatruck; API, sockets and
# uploads go to the Ninja Truck backend (pm2 "ninjatruck-api", 127.0.0.1:5016,
# database "ninjatruck"). HTTPS lines are managed by certbot.
server {
    server_name ninjatruck.live www.ninjatruck.live;

    client_max_body_size 25m;

    root /var/www/ninjatruck;
    index index.html;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5016/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5016/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5016/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5016/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names the hashed chunks; it must be revalidated on every visit
    # or a browser holding a stale copy asks for deleted chunks and goes blank.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # hashed build assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # client-side router: every unknown path resolves to the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ninjatruck.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ninjatruck.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.ninjatruck.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ninjatruck.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ninjatruck.live www.ninjatruck.live;
    return 404; # managed by Certbot




}