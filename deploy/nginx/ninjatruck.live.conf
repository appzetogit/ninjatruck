# Ninja Truck — static frontend for ninjatruck.live.
# Installed at /etc/nginx/sites-available/ninjatruck.live.conf, symlinked into
# sites-enabled. The build talks to the existing backend at zicab.in, so no API
# proxy is needed here. HTTPS is added by certbot once DNS points at this server.
server {
    server_name ninjatruck.live www.ninjatruck.live;

    root /var/www/ninjatruck;
    index index.html;

    # index.html names the hashed chunks; it must be revalidated on every visit
    # or a browser holding a stale copy asks for deleted chunks and goes blank.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # hashed build assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # client-side router: every unknown path resolves to the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ninjatruck.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ninjatruck.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.ninjatruck.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ninjatruck.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ninjatruck.live www.ninjatruck.live;
    return 404; # managed by Certbot




}